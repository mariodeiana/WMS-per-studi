<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validazione Pratica · WMS</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="topbar"><span class="brand">WMS</span><span>Validazione Pratica</span><a href="/">Scheda Manager</a><span class="environment">VALIDATORE · valeria.validatore</span></header><main><section class="card actions"><p class="eyebrow">Separazione dei compiti</p><h1>Validazione LIPE_TRIM</h1><p id="summary">Caricamento…</p><div id="message" role="alert" hidden></div><section class="dossier"><h2>Risultati ed evidenze dei task</h2><div id="results"></div><div id="evidence"></div></section><label>Esito<select id="outcome"><option>VALIDATA</option><option>VALIDATA_CON_RILIEVI</option></select></label><label>Nota di validazione<textarea id="note" rows="4"></textarea></label><label>Evidenze<input id="files" type="file" multiple></label><button id="validate" disabled>Registra risultato e valida</button></section></main>
<script>const id='P-2026-LIPE-001',button=document.querySelector('#validate'),message=document.querySelector('#message');const esc=v=>{const n=document.createElement('span');n.textContent=v??'';return n.innerHTML};function evidenceHtml(x){const meta=[x.document_type,x.description,x.actor,x.created_at?new Date(x.created_at).toLocaleString('it-IT'):''].filter(Boolean).join(' · ');return `<span class="doc-preview"><a class="doc-icon" href="${x.preview_url}" target="_blank" title="${esc(meta)}">📄 ${esc(x.filename)}</a><span class="doc-popover"><span>${esc(meta)}</span><a href="${x.download_url}">Scarica</a></span></span>`}async function load(){const r=await fetch('/api/practices/'+id),p=await r.json();document.querySelector('#summary').textContent=`${p.id} · stato ${p.status} · ${p.progress.completed}/${p.progress.total} task completati`;const byId=Object.fromEntries(p.evidence.map(x=>[x.id,x]));document.querySelector('#results').innerHTML=p.results.filter(x=>x.action==='TASK').map(x=>`<div class="result"><strong>${x.related_task_code} · ${esc(x.outcome)}</strong><p>${esc(x.note||'Nessuna nota')}</p><small>${esc(x.actor)} · ${new Date(x.timestamp).toLocaleString('it-IT')}</small><div class="evidence-list">${x.evidence_ids.map(eid=>byId[eid]?evidenceHtml(byId[eid]):'').join('')}</div></div>`).join('')||'<p>Nessun risultato.</p>';document.querySelector('#evidence').innerHTML=p.evidence.length?p.evidence.map(evidenceHtml).join(''):'<p>Nessuna evidenza.</p>';button.disabled=p.status!=='DA_VALIDARE'}function readFile(file){return new Promise((resolve,reject)=>{if(file.size>5*1024*1024){reject(new Error(`${file.name}: dimensione superiore a 5 MB`));return}const reader=new FileReader();reader.onload=()=>resolve(String(reader.result).split(',',2)[1]||'');reader.onerror=()=>reject(new Error(`Impossibile leggere ${file.name}`));reader.readAsDataURL(file)})}button.onclick=async()=>{try{const attachments=[];for(const f of [...document.querySelector('#files').files])attachments.push({filename:f.name,content_type:f.type||'application/octet-stream',document_type:'DOCUMENTO',content_base64:await readFile(f)});const r=await fetch(`/api/practices/${id}/validate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor:'valeria.validatore',outcome:document.querySelector('#outcome').value,note:document.querySelector('#note').value,attachments})}),data=await r.json();if(!r.ok)throw new Error(data.error);await load()}catch(error){message.textContent=error.message;message.hidden=false}};load()</script></body></html>
