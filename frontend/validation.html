<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validazione Pratica · WMS</title><link rel="stylesheet" href="/styles.css"></head>
<body><header class="topbar"><span class="brand">WMS</span><span>Validazione Pratica</span><a href="/">Scheda Manager</a><span class="environment">VALIDATORE · valeria.validatore</span></header><main><section class="card actions"><p class="eyebrow">Separazione dei compiti</p><h1>Validazione LIPE_TRIM</h1><p id="summary">Caricamento…</p><div id="message" role="alert" hidden></div><section class="dossier"><h2>Risultati ed evidenze dei task</h2><div id="results"></div><div id="evidence"></div></section><label>Esito<select id="outcome"><option>VALIDATA</option><option>VALIDATA_CON_RILIEVI</option></select></label><label>Nota di validazione<textarea id="note" rows="4"></textarea></label><label>Evidenze<input id="files" type="file" multiple></label><button id="validate" disabled>Registra risultato e valida</button></section></main>
<script>const id='P-2026-LIPE-001',button=document.querySelector('#validate'),message=document.querySelector('#message');async function load(){const r=await fetch('/api/practices/'+id),p=await r.json();document.querySelector('#summary').textContent=`${p.id} · stato ${p.status} · ${p.progress.completed}/${p.progress.total} task completati`;document.querySelector('#results').innerHTML=p.results.filter(x=>x.action==='TASK').map(x=>`<div class="result"><strong>${x.related_task_code} · ${x.outcome}</strong><p>${x.note||'Nessuna nota'}</p><small>${x.actor} · ${new Date(x.timestamp).toLocaleString('it-IT')}</small></div>`).join('')||'<p>Nessun risultato.</p>';document.querySelector('#evidence').innerHTML=p.evidence.map(x=>`<span class="evidence">${x.filename}</span>`).join('');button.disabled=p.status!=='DA_VALIDARE'}button.onclick=async()=>{const attachments=[...document.querySelector('#files').files].map(f=>({filename:f.name,content_type:f.type||'application/octet-stream'}));const r=await fetch(`/api/practices/${id}/validate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor:'valeria.validatore',outcome:document.querySelector('#outcome').value,note:document.querySelector('#note').value,attachments})}),data=await r.json();if(!r.ok){message.textContent=data.error;message.hidden=false}else load()};load()</script></body></html>
