<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Validazione Pratica · WMS</title><link rel="stylesheet" href="/styles.css"></head><body><header class="topbar"><span class="brand">WMS</span><span>Validazione Pratica</span><a href="/">Scheda Manager</a><span class="environment">VALIDATORE · valeria.validatore</span></header><main><section class="card actions"><p class="eyebrow">Separazione dei compiti</p><h1>Validazione LIPE_TRIM</h1><p id="summary">Caricamento…</p><div id="message" role="alert" hidden></div><button id="validate" disabled>Valida pratica</button></section></main><script>const id='P-2026-LIPE-001',button=document.querySelector('#validate'),message=document.querySelector('#message');async function load(){const r=await fetch('/api/practices/'+id),p=await r.json();document.querySelector('#summary').textContent=`${p.id} · stato ${p.status} · ${p.progress.completed}/${p.progress.total} task completati`;button.disabled=p.status!=='DA_VALIDARE'}button.onclick=async()=>{const r=await fetch(`/api/practices/${id}/validate`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({actor:'valeria.validatore'})}),data=await r.json();if(!r.ok){message.textContent=data.error;message.hidden=false}else load()};load()</script></body></html>
