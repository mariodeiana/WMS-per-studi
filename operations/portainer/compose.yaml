{
  "services": {
    "portainer": {
      "image": "portainer/portainer-ce@sha256:4d616db18cfeb5dd41a69c0958bc825c84483ea9cde1106eb82a5d26f3bd8b0e",
      "container_name": "asc-portainer",
      "restart": "unless-stopped",
      "ports": [
        "192.168.11.10:9443:9443"
      ],
      "volumes": [
        "/var/run/docker.sock:/var/run/docker.sock",
        "portainer-data:/data"
      ]
    }
  },
  "volumes": {
    "portainer-data": {
      "name": "asc-portainer-data"
    }
  },
  "networks": {
    "default": {
      "name": "asc-portainer-network"
    }
  }
}
